id: creditcard-robust-pca-transductive-validation-f1-quantile
dataset: creditcard
model:
  name: robust_pca
  parameters:
    tolerance: 1.0e-5
    max_iterations: 1000
  candidates:
    lambda:
    - 0.002
    - 0.004
    - 0.008
protocol: transductive
training:
  epochs: 1
threshold:
  name: validation_f1_quantile
selection:
  metric: f1
  direction: maximize
metrics:
  vus:
    max_window: 100
    threshold_samples: 250
  range:
    recall_existence_weight: 0.2
