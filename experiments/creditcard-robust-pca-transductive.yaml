id: creditcard-robust-pca-transductive
dataset: creditcard
model:
  name: robust_pca
  parameters:
    tolerance: 1.0e-5
    max_iterations: 1000
    score_norm: l1
    feature_scaling: standard
  candidates:
    lambda:
    - 0.002
    - 0.00419
    - 0.008
protocol: transductive
training:
  epochs: 1
threshold:
  name: validation_f1
selection:
  metric: f1
  direction: maximize
metrics:
  point:
  - precision
  - recall
  - f1
