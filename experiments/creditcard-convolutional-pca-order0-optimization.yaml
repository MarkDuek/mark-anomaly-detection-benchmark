id: creditcard-convolutional-pca-order0-optimization
dataset: creditcard
model:
  name: convolutional_pca
  parameters:
    n_components: 25
    filter_order: 0
    standardize_features: true
    step_size: 0.2
    max_iterations: 200
  candidates:
    max_iterations: [200, 1000, 5000]
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1_quantile
selection:
  metric: f1
  direction: maximize
metrics:
  vus:
    max_window: 100
    threshold_samples: 250
  range:
    recall_existence_weight: 0.2
