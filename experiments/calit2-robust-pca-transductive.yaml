id: calit2-robust-pca-transductive
dataset: calit2
model:
  name: robust_pca
  parameters:
    tolerance: 1.0e-7
    max_iterations: 1000
    score_norm: l1
    feature_scaling: standard
  candidates:
    lambda:
    - 0.008
    - 0.01575
    - 0.032
protocol: transductive
training:
  epochs: 1
threshold:
  name: validation_f1
selection:
  metric: f1
  direction: maximize
metrics:
  point:
  - precision
  - recall
  - f1
