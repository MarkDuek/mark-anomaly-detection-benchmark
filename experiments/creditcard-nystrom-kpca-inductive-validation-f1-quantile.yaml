id: creditcard-nystrom-kpca-inductive-validation-f1-quantile
dataset: creditcard
model:
  name: nystrom_kpca
  parameters:
    n_components: 5
    n_landmarks: 64
    kernel: rbf
    kernel_params:
      gamma: 0.03333333333333333
    standardize_features: true
    random_state: 42
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1_quantile
selection:
  metric: f1
  direction: maximize
metrics:
  vus:
    max_window: 100
    threshold_samples: 250
  range:
    recall_existence_weight: 0.2
