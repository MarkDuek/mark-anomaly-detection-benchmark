id: creditcard-convolutional-pca-filter-orders
dataset: creditcard
model:
  name: convolutional_pca
  parameters:
    n_components: 25
    filter_order: 0
    standardize_features: true
    step_size: 0.2
    max_iterations: 1000
  candidates:
    filter_order: [0, 1, 3, 5, 10]
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1_quantile
selection:
  metric: f1
  direction: maximize
metrics:
  vus:
    max_window: 100
    threshold_samples: 250
  range:
    recall_existence_weight: 0.2
