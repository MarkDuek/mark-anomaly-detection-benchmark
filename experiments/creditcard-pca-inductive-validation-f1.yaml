id: creditcard-pca-inductive-validation-f1
dataset: creditcard
model:
  name: pca
  parameters:
    n_components: 13
    standardize_features: false
  candidates:
    n_components:
    - 13
    - 20
    - 26
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1
selection:
  metric: f1
  direction: maximize
metrics:
  vus:
    max_window: 100
    threshold_samples: 250
  range:
    recall_existence_weight: 0.2
