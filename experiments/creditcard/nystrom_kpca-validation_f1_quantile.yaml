id: creditcard-nystrom_kpca-validation_f1_quantile
dataset: creditcard
model:
  name: nystrom_kpca
  candidates:
    n_components: [1, 5, 13, 20, 26, 28]
    n_landmarks: [32, 64, 128]
    kernel: [linear, poly, rbf]
