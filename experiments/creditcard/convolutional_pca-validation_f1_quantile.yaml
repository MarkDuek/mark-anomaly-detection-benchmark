id: creditcard-convolutional_pca-validation_f1_quantile
dataset: creditcard
model:
  name: convolutional_pca
  candidates:
    n_components: [1, 5, 13, 20, 26, 28]
    filter_order: [0, 1, 3, 5]
    standardize_features: [false, true]
    step_size: [0.1, 0.2]
    max_iterations: [1000]
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1_quantile
selection:
  metric: f1
  direction: maximize
