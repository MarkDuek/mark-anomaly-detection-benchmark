id: creditcard-maxent_pca-validation_f1_quantile
dataset: creditcard
model:
  name: maxent_pca
  candidates:
    n_components: [1, 5, 13, 20, 26, 28]
    standardize_features: [false, true]
    bandwidth_scale: [1.0, 2.0, 4.0]
    pair_batch_size: [1024]
    max_iterations: [1000]
    random_state: [42]
    optimizer:
    - name: sgd
      learning_rate: 0.1
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1_quantile
selection:
  metric: f1
  direction: maximize
