id: calit2-kernel-pca-inductive
dataset: calit2
model:
  name: kernel_pca
  parameters:
    n_components: 1
    standardize_features: true
    kernel_parameters: {}
  candidates:
    kernel:
    - linear
    - poly
    - rbf
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1
selection:
  metric: f1
  direction: maximize
metrics:
  vus:
    max_window: 100
    threshold_samples: 250
  range:
    recall_existence_weight: 0.2
