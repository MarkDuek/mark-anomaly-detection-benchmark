id: creditcard-nystrom-kpca-inductive-kernels-validation-f1-quantile
dataset: creditcard
model:
  name: nystrom_kpca
  parameters:
    n_landmarks: 64
    random_state: 42
    eigenvalue_tol_mode: relative
  candidates:
  - kernel: linear
    kernel_params: {}
    n_components: 5
    standardize_features: true
  - kernel: linear
    kernel_params: {}
    n_components: 13
    standardize_features: false
  - kernel: poly
    kernel_params:
      gamma: 0.03333333333333333
      degree: 2
      coef0: 1.0
    n_components: 5
    standardize_features: true
  - kernel: poly
    kernel_params:
      gamma: 0.03333333333333333
      degree: 2
      coef0: 1.0
    n_components: 13
    standardize_features: true
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1_quantile
selection:
  metric: f1
  direction: maximize
metrics:
  vus:
    max_window: 100
    threshold_samples: 250
  range:
    recall_existence_weight: 0.2
