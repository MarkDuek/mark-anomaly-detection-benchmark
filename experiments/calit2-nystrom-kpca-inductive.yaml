id: calit2-nystrom-kpca-inductive
dataset: calit2
model:
  name: nystrom_kpca
  parameters:
    n_components: 1
    n_landmarks: 100
    kernel: rbf
    kernel_params:
      gamma: 0.5
    standardize_features: true
    random_state: 42
protocol: inductive
training:
  epochs: 1
threshold:
  name: validation_f1
selection:
  metric: f1
  direction: maximize
metrics:
  vus:
    max_window: 100
    threshold_samples: 250
  range:
    recall_existence_weight: 0.2
