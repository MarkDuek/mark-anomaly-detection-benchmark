[project]
name = "mark-anomaly-detection-benchmark"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=1.27.0",
    "numpy>=2.4.6",
    "plotly>=6.9.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "tqdm>=4.67.1",
    "vus==0.0.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
